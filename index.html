<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF7A59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>푸꾸옥 꼬우 🥥</title>
<style>
:root{
  --cream:#FFF8EF; --cream2:#FFF1DE;
  --coral:#FF7A59; --coral-dark:#F05B3A; --sunset1:#FF9A62; --sunset2:#FF6B6B;
  --teal:#17A2A2; --teal-dark:#0E8C8C; --teal-light:#E0F5F4;
  --ink:#35322E; --ink-soft:#7A736A; --line:#F0E4D3;
  --white:#FFFFFF; --danger:#E05555; --gold:#F4B400;
  --shadow:0 2px 10px rgba(90,60,30,.09);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cream); color:var(--ink); line-height:1.5;
  max-width:520px; margin:0 auto; min-height:100vh; word-break:keep-all;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem}
.hidden{display:none!important}

/* ---------- 상단 헤더 ---------- */
.header{
  background:linear-gradient(135deg,var(--sunset1),var(--sunset2));
  color:#fff; padding:calc(14px + env(safe-area-inset-top)) 20px 18px;
  border-radius:0 0 24px 24px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.header::after{content:"🌴"; position:absolute; right:-6px; bottom:-14px; font-size:5.2rem; opacity:.18; transform:rotate(-12deg)}
.header h1{font-size:1.45rem; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.header .sub{font-size:.85rem; opacity:.92; margin-top:2px}
.header .dday{
  position:absolute; top:calc(16px + env(safe-area-inset-top)); right:18px;
  background:rgba(255,255,255,.24); backdrop-filter:blur(4px);
  border-radius:999px; padding:6px 14px; font-weight:800; font-size:.95rem;
}

/* ---------- 공통 카드/섹션 ---------- */
.view{padding:16px 16px 8px; animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
.sec-title{font-size:1.02rem; font-weight:800; margin:4px 2px 10px; display:flex; align-items:center; gap:6px}
.sec-title small{font-weight:600; color:var(--ink-soft); font-size:.8rem; margin-left:auto}

/* ---------- 꼬우 말풍선 ---------- */
.kkou{display:flex; gap:10px; align-items:flex-start; background:var(--teal-light); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px}
.kkou .face{font-size:1.9rem; flex-shrink:0; animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.kkou .bubble{font-size:.9rem; color:var(--teal-dark); font-weight:600}
.kkou .bubble b{color:var(--ink)}

/* ---------- 홈 통계 ---------- */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px}
.stat{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 8px; text-align:center}
.stat .num{font-size:1.25rem; font-weight:800; color:var(--coral-dark)}
.stat .lbl{font-size:.75rem; color:var(--ink-soft); font-weight:600; margin-top:2px}
.member-chips{display:flex; flex-wrap:wrap; gap:8px}
.mchip{display:flex; align-items:center; gap:6px; border-radius:999px; padding:6px 12px; font-size:.85rem; font-weight:700; color:#fff}
.mchip.me::after{content:"나"; background:rgba(255,255,255,.3); font-size:.68rem; padding:1px 6px; border-radius:999px}

/* ---------- 변경 피드 ---------- */
.feed-item{display:flex; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:.86rem; align-items:baseline}
.feed-item:last-child{border-bottom:none}
.feed-item .who{flex-shrink:0}
.feed-item .txt{color:var(--ink)}
.feed-item .time{margin-left:auto; flex-shrink:0; color:var(--ink-soft); font-size:.72rem}
.empty{color:var(--ink-soft); font-size:.88rem; text-align:center; padding:18px 0}

/* ---------- DAY 탭 ---------- */
.day-tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex-shrink:0; background:var(--white); border:2px solid transparent; border-radius:14px;
  padding:8px 14px; text-align:center; box-shadow:var(--shadow); min-width:74px;
}
.day-tab .d{font-weight:800; font-size:.92rem}
.day-tab .dt{font-size:.7rem; color:var(--ink-soft); font-weight:600}
.day-tab.active{border-color:var(--coral); background:#FFF0E9}
.day-tab.active .d{color:var(--coral-dark)}
.day-head{display:flex; align-items:center; gap:8px; margin:2px 2px 12px}
.day-head .t{font-weight:800; font-size:1.05rem}
.day-head .sort-btn{margin-left:auto; font-size:.78rem; font-weight:700; color:var(--teal-dark); background:var(--teal-light); border-radius:999px; padding:6px 12px}

/* ---------- 타임라인 ---------- */
.timeline{position:relative; padding-left:74px}
.timeline::before{content:""; position:absolute; left:58px; top:8px; bottom:8px; width:3px; background:var(--line); border-radius:2px}
.titem{position:relative; margin-bottom:14px}
.titem .time-col{
  position:absolute; left:-74px; top:14px; width:52px; text-align:right;
  font-size:.78rem; font-weight:800; color:var(--ink-soft); line-height:1.25;
}
.titem .time-col .end{font-weight:600; font-size:.68rem; opacity:.75}
.titem .dot{
  position:absolute; left:-23px; top:16px; width:15px; height:15px; border-radius:50%;
  background:var(--white); border:4px solid #DAD3C8; z-index:1; transition:border-color .2s, box-shadow .2s;
}
.tcard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:13px 14px; position:relative}
.tcard .row1{display:flex; align-items:flex-start; gap:9px}
.tcard .cat{font-size:1.5rem; flex-shrink:0; width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center}
.tcard .tt{font-weight:800; font-size:1rem; letter-spacing:-.01em}
.tcard .place{font-size:.8rem; color:var(--ink-soft); margin-top:1px; display:flex; align-items:center; gap:4px}
.tcard .memo{font-size:.85rem; color:var(--ink); background:var(--cream); border-radius:10px; padding:7px 10px; margin-top:9px; white-space:pre-wrap}
.tcard .meta{display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap}
.badge{font-size:.7rem; font-weight:800; border-radius:999px; padding:3px 9px}
.badge.confirm{background:var(--teal-light); color:var(--teal-dark)}
.badge.cand{background:#FFF3D6; color:#A87900}
.badge.done{background:#EEEAE4; color:#8A8377}
.cost{font-size:.78rem; font-weight:700; color:var(--coral-dark)}
.cost small{color:var(--ink-soft); font-weight:600}
.byline{font-size:.7rem; color:var(--ink-soft); margin-left:auto}
.reactions{display:flex; gap:6px; margin-top:10px; align-items:center}
.rbtn{border-radius:999px; padding:4px 10px; font-size:.82rem; background:var(--cream); border:1.5px solid transparent; font-weight:700; color:var(--ink-soft)}
.rbtn.on{border-color:var(--coral); background:#FFF0E9; color:var(--coral-dark)}
.card-actions{display:flex; gap:2px; margin-left:auto}
.icon-btn{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; color:var(--ink-soft)}
.icon-btn:active{background:var(--cream)}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:calc(50% - 250px); bottom:calc(90px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; z-index:40;
  background:linear-gradient(135deg,var(--sunset1),var(--sunset2)); color:#fff;
  font-size:1.7rem; font-weight:700; box-shadow:0 6px 18px rgba(240,91,58,.4);
  display:flex; align-items:center; justify-content:center;
}
@media (max-width:540px){.fab{right:18px}}
.fab:active{transform:scale(.94)}

/* ---------- 하단 탭 ---------- */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); display:flex; z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1; padding:9px 0 7px; text-align:center; color:#B4AB9F}
.tab .ico{font-size:1.35rem; display:block; filter:grayscale(1); opacity:.65; transition:.15s}
.tab .lb{font-size:.66rem; font-weight:700; margin-top:1px; display:block}
.tab.active{color:var(--coral-dark)}
.tab.active .ico{filter:none; opacity:1; transform:translateY(-2px)}

/* ---------- 모달 ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(40,30,20,.45); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fadein .18s}
.modal{
  background:var(--white); width:100%; max-width:520px; border-radius:22px 22px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal h2{font-size:1.15rem; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px}
.modal h2 .x{margin-left:auto; font-size:1.3rem; color:var(--ink-soft); width:38px; height:38px}
.f-label{font-size:.8rem; font-weight:800; color:var(--ink-soft); margin:13px 2px 6px; display:block}
.f-input{width:100%; border:2px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--cream); font-weight:600}
.f-input:focus{outline:none; border-color:var(--coral); background:#fff}
textarea.f-input{resize:vertical; min-height:64px}
.f-row{display:flex; gap:10px}
.f-row>*{flex:1}
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.trans-row{display:flex; gap:8px; margin-top:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.trans-row::-webkit-scrollbar{display:none}
.trans-opt{flex:0 0 auto; border:2px solid var(--line); border-radius:12px; padding:7px 12px; text-align:center; background:var(--cream)}
.trans-opt .e{font-size:1.25rem; display:block}
.trans-opt .n{font-size:.68rem; font-weight:700; color:var(--ink-soft)}
.trans-opt.sel{border-color:var(--coral); background:#FFF0E9}
.trans-opt.sel .n{color:var(--coral-dark)}
.cat-opt{border:2px solid var(--line); border-radius:12px; padding:8px 2px; text-align:center; background:var(--cream)}
.cat-opt .e{font-size:1.3rem; display:block}
.cat-opt .n{font-size:.7rem; font-weight:700; color:var(--ink-soft)}
.cat-opt.sel{border-color:var(--coral); background:#FFF0E9}
.cat-opt.sel .n{color:var(--coral-dark)}
.seg{display:flex; background:var(--cream); border-radius:12px; padding:4px; gap:4px}
.seg button{flex:1; border-radius:9px; padding:9px 0; font-weight:800; font-size:.88rem; color:var(--ink-soft)}
.seg button.sel{background:#fff; color:var(--coral-dark); box-shadow:var(--shadow)}
.krw-hint{font-size:.78rem; color:var(--teal-dark); font-weight:700; margin-top:5px; min-height:1.1em}
.btn-primary{
  width:100%; margin-top:20px; padding:15px; border-radius:14px; font-size:1.05rem; font-weight:800; color:#fff;
  background:linear-gradient(135deg,var(--sunset1),var(--sunset2)); box-shadow:0 4px 14px rgba(240,91,58,.35);
}
.btn-primary:active{transform:scale(.98)}
.btn-danger-line{width:100%; margin-top:10px; padding:12px; border-radius:14px; font-weight:800; color:var(--danger); background:#FDEDED}

/* ---------- 확인/토스트 ---------- */
.confirm-box{background:#fff; border-radius:20px; padding:22px; margin:auto 24px; max-width:340px; text-align:center; animation:slideup .2s}
.confirm-box .big{font-size:2.2rem}
.confirm-box p{font-weight:700; margin:8px 0 18px}
.confirm-box .btns{display:flex; gap:10px}
.confirm-box .btns button{flex:1; padding:12px; border-radius:12px; font-weight:800}
.b-gray{background:var(--cream); color:var(--ink-soft)}
.b-red{background:var(--danger); color:#fff}
.toast{
  position:fixed; bottom:calc(84px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; border-radius:999px; padding:11px 18px; font-size:.88rem; font-weight:700;
  display:flex; gap:14px; align-items:center; z-index:200; box-shadow:0 6px 18px rgba(0,0,0,.25);
  animation:slideup .2s; white-space:nowrap;
}
.toast button{color:#FFD08A; font-weight:800; font-size:.88rem}

/* ---------- 온보딩 ---------- */
.onboard{position:fixed; inset:0; background:linear-gradient(160deg,#FFB37D,#FF6B6B 60%,#E85D75); z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; color:#fff}
.onboard .logo{font-size:4rem; animation:bob 2.6s ease-in-out infinite}
.onboard h1{font-size:1.7rem; font-weight:900; margin:10px 0 4px; letter-spacing:-.02em}
.onboard p{font-weight:600; opacity:.94; margin-bottom:26px}
.ob-input{width:100%; max-width:340px; border:none; border-radius:14px; padding:14px; font-size:1.05rem; font-weight:700; text-align:center; margin-bottom:14px; box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ob-input:focus{outline:3px solid rgba(255,255,255,.7)}
.emoji-grid{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:340px; margin-bottom:18px; max-height:190px; overflow-y:auto; padding:4px}
.emoji-grid::-webkit-scrollbar{width:5px} .emoji-grid::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:9px}
.eopt{width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.28); font-size:1.45rem; display:flex; align-items:center; justify-content:center; border:2.5px solid transparent; transition:.12s; flex-shrink:0}
.eopt.sel{background:#fff; border-color:#fff; transform:scale(1.12)}
.ob-btn{background:#fff; color:var(--coral-dark); font-weight:900; font-size:1.05rem; border-radius:999px; padding:14px 44px; box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ob-btn:active{transform:scale(.96)}
.fx-row{display:flex; justify-content:space-between; padding:7px 2px; border-bottom:1px dashed var(--line); font-size:.92rem; font-weight:700}
.fx-row:last-child{border-bottom:none}
.fx-row .v{color:var(--coral-dark); font-weight:800}
/* ---------- 홈 하루 일정 ---------- */
.hrow{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px dashed var(--line); cursor:pointer}
.hrow:last-child{border-bottom:none}
.hrow .ht{flex:0 0 46px; font-weight:800; font-size:.88rem; color:var(--coral-dark); text-align:right}
.hrow .he{font-size:1.3rem; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.hrow .h1{font-weight:800; font-size:.98rem}
.hrow .h2{font-size:.75rem; color:var(--ink-soft)}
.dnav{width:34px; height:34px; border-radius:10px; font-size:1rem; font-weight:800; color:var(--coral-dark); background:#FFF0E9; flex-shrink:0}
.dnav:disabled{opacity:.3}
/* ---------- 지출 기록 ---------- */
.exp-row{display:flex; align-items:center; gap:9px; padding:8px 2px; border-bottom:1px dashed var(--line); font-size:.88rem}
.exp-row:last-child{border-bottom:none}
.exp-row .when{flex-shrink:0; font-size:.66rem; font-weight:800; background:var(--cream2); color:var(--ink-soft); border-radius:999px; padding:3px 8px}
.exp-row .et{font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.exp-row .ev{margin-left:auto; flex-shrink:0; font-weight:800; color:var(--teal-dark)}
.exp-row .del{color:var(--ink-soft); width:28px; height:28px; flex-shrink:0; border-radius:8px}
.spent-sum{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px}
.spent-sum .stat .num.sp{color:var(--teal-dark)}

/* ---------- 준비물 ---------- */
.prog{height:10px; background:var(--cream2); border-radius:999px; overflow:hidden; margin:8px 0 2px}
.prog>div{height:100%; background:linear-gradient(90deg,var(--sunset1),var(--sunset2)); border-radius:999px; transition:width .3s}
.pk{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line)}
.pk:last-child{border-bottom:none}
.pk input[type=checkbox]{width:22px; height:22px; accent-color:var(--teal); flex-shrink:0}
.pk .tx{font-weight:700; font-size:.92rem}
.pk.done .tx{text-decoration:line-through; color:var(--ink-soft); font-weight:600}
.pk .who2{font-size:.7rem; color:var(--ink-soft); margin-left:auto; flex-shrink:0}
.pk .del{color:var(--ink-soft); font-size:.9rem; width:30px; height:30px; flex-shrink:0; border-radius:8px}
.pk .del:active{background:var(--cream)}
.addrow{display:flex; gap:8px}
.addrow input{flex:1; min-width:0}
.addrow select{flex:0 0 104px}
/* ---------- 경비 차트 & 환율 ---------- */
.costbar{display:flex; align-items:center; gap:8px; padding:5px 0}
.costbar .lbl2{flex:0 0 78px; font-size:.8rem; font-weight:700}
.costbar .track{flex:1; height:14px; background:var(--cream); border-radius:4px}
.costbar .fill{height:100%; background:var(--coral); border-radius:0 4px 4px 0; min-width:2px}
.costbar .val{flex:0 0 66px; text-align:right; font-size:.74rem; font-weight:700; color:var(--ink-soft)}
.conv{display:flex; gap:8px; align-items:center; margin-top:12px}
.conv2{display:flex; gap:8px; align-items:center; margin-top:12px}
.conv2 input{flex:1; min-width:0; text-align:right}
.conv2 select{flex:0 0 84px}
.conv2 span{flex-shrink:0; font-weight:800; color:var(--ink-soft)}
.cvOut{margin-top:8px; text-align:right; font-weight:700; color:var(--ink-soft); min-height:1.2em; font-size:.95rem}
.cvOut b{color:var(--coral-dark); font-size:1.05rem}
.reco{display:flex; align-items:center; gap:10px; background:var(--teal-light); border-radius:12px; padding:11px 13px}
.reco-txt{font-weight:800; font-size:.92rem; color:var(--teal-dark)}
.more-btn{margin-left:auto; font-size:.76rem; font-weight:800; color:var(--teal-dark); background:var(--teal-light); border-radius:999px; padding:5px 11px; flex-shrink:0}
.reco-chips{display:flex; flex-wrap:wrap; gap:7px}
.reco-chip{border:1.5px solid var(--teal); background:var(--teal-light); color:var(--teal-dark); border-radius:999px; padding:7px 12px; font-size:.84rem; font-weight:700; line-height:1.1}
.reco-chip:active{transform:scale(.95)}
.reco-chip.done{border-color:var(--line); background:var(--cream); color:var(--ink-soft)}
.news-item{display:block; padding:9px 2px; border-bottom:1px dashed var(--line); text-decoration:none; color:inherit}
.news-item:last-of-type{border-bottom:none}
.news-item:active{background:var(--cream)}
.news-item .nt{font-weight:700; font-size:.9rem; line-height:1.35}
.news-item .ns{font-size:.72rem; color:var(--ink-soft); margin-top:2px}
button.stat{font-family:inherit}
.hourly{max-height:56vh; overflow-y:auto}
.hr{display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px dashed var(--line)}
.hr:last-child{border-bottom:none}
.hr .hh{flex:0 0 46px; font-weight:800; color:var(--ink-soft)}
.hr .he{font-size:1.4rem; flex:0 0 34px; text-align:center}
.hr .htp{flex:0 0 46px; font-weight:800; font-size:1.02rem}
.hr .hpp{margin-left:auto; font-size:.82rem; color:var(--teal-dark); font-weight:700}
.donebtn{width:100%; margin-top:10px; padding:11px; border-radius:12px; font-weight:800; font-size:.9rem; background:var(--cream2); color:var(--ink-soft)}
.donebtn.on{background:var(--teal-light); color:var(--teal-dark)}
.donebtn:active{transform:scale(.98)}
.conv input{text-align:right; min-width:0}
.conv span{flex-shrink:0; font-weight:800; color:var(--ink-soft); font-size:.85rem}
/* ---------- 날씨 ---------- */
.wx{display:flex; gap:8px; overflow-x:auto; padding-top:4px; scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wx .wd{flex:0 0 78px; background:var(--cream); border-radius:12px; padding:9px 4px; text-align:center; cursor:pointer}
.wx .wd:active{background:var(--cream2)}
.wx .wd .e2{font-size:1.6rem; line-height:1.4}
.wx .wd .t1{font-size:.86rem; font-weight:800}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.trip && d.items){
        // 마이그레이션: 좌표 없는 장소는 좌표 사전에서 자동 채움
        d.items.forEach(it=>{
          if(it.place && it.place.name && it.place.lat==null){
            const c = PLACE_COORDS[it.place.name];
            if(c) Object.assign(it.place, c);
          }
        });
        if(!d.pack) d.pack = [];
        if(!d.diary) d.diary = {};
        if(!d.expenses) d.expenses = [];
        return migrate(d);
      }
    }
  }catch(e){}
  return migrate(demoData());
}
function migrate(d){
  (d.pack||[]).forEach(p=>{ if(!p.kind) p.kind="pack"; });
  (d.items||[]).forEach(it=>{
    if(it.status==="후보"||it.status==="확정") it.status="예정";
    if(it.cost && !it.costCur) it.costCur="₫";
    if(it.memo){
      it.comments = it.comments||[];
      it.comments.unshift({id:"m"+it.id, by:it.createdBy||"m1", text:it.memo, ts:it.updatedAt||Date.now()});
      it.memo = "";
    }
  });
  return d;
}

/* 시간대: 자동(기기 위치) / 한국 / 푸꾸옥 — 지난·다음 일정과 헤더 시계의 '지금' 기준 */
const TZ = { kr:{id:"Asia/Seoul", label:"🇰🇷 한국"}, vn:{id:"Asia/Ho_Chi_Minh", label:"🇻🇳 푸꾸옥"} };
let tzMode = localStorage.getItem("pqgo_tz") || "auto";  // auto | kr | vn
function effTz(){
  if(tzMode==="kr") return TZ.kr;
  if(tzMode==="vn") return TZ.vn;
  try{
    const z = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(["Asia/Ho_Chi_Minh","Asia/Bangkok","Asia/Phnom_Penh","Asia/Vientiane","Asia/Jakarta"].includes(z)) return TZ.vn;
    if(["Asia/Seoul","Asia/Tokyo","Asia/Pyongyang"].includes(z)) return TZ.kr;
    const off = -new Date().getTimezoneOffset()/60;   // 기기 UTC 오프셋(시간)
    return off <= 7.5 ? TZ.vn : TZ.kr;
  }catch(e){ return TZ.kr; }
}
function cycleTz(){
  tzMode = tzMode==="auto" ? "kr" : (tzMode==="kr" ? "vn" : "auto");
  localStorage.setItem("pqgo_tz", tzMode);
  renderAll();
  toast(`${effTz().label} 시간 기준으로 볼게요${tzMode==="auto"?" (기기 위치 자동)":""}`);
}
/* 선택된 시간대의 '지금' — 일정 시간 문자열 자체는 바꾸지 않음 */
function pqParts(){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:effTz().id,hourCycle:'h23',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return {y:+g('year'), mo:+g('month'), d:+g('day'), h:+g('hour')%24, mi:+g('minute')};
}
function pqTodayStr(){ const p=pqParts(); return `${p.y}-${String(p.mo).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`; }
function pqToday(){ return new Date(pqTodayStr()+"T00:00:00"); }
function pqNowMin(){ const p=pqParts(); return p.h*60+p.mi; }
function pqNowHM(){ const p=pqParts(); return String(p.h).padStart(2,'0')+":"+String(p.mi).padStart(2,'0'); }
/* 일정 비용을 원화로 (통화 선택 반영) */
function itemKrw(i){ const c=+i.cost||0; return i.costCur==="₩" ? c : c*EX_RATE; }
function dayCount(){
  return Math.round((new Date(S.trip.endDate) - new Date(S.trip.startDate))/86400e3)+1;
}
function dayDate(i){
  const d = new Date(S.trip.startDate+"T00:00:00"); d.setDate(d.getDate()+i); return d;
}
function fmtDate(d, opt){ return d.toLocaleDateString("ko-KR", opt||{month:"long",day:"numeric",weekday:"short"}); }
function relTime(ts){
  const m = Math.round((Date.now()-ts)/60000);
  if(m<1) return "방금"; if(m<60) return m+"분 전";
  const h = Math.round(m/60); if(h<24) return h+"시간 전";
  return Math.round(h/24)+"일 전";
}
function dayItems(i){
  return S.items.filter(x=>x.dayIndex===i).sort((a,b)=>(a.order-b.order));
}
function addFeed(txt){
  const e = {who:meId, txt, ts:Date.now()};
  S.feed.unshift(e);
  S.feed = S.feed.slice(0,15);
  if(FB.on) roomRef().collection("feed").add(e).catch(()=>{});

function toast(msg, undoFn){
  const root = $("#toastRoot");
  root.innerHTML = `<div class="toast">${esc(msg)}${undoFn?'<button id="undoBtn">되돌리기</button>':""}</div>`;
  if(undoFn) $("#undoBtn").onclick = ()=>{ undoFn(); root.innerHTML=""; };
  clearTimeout(toast._t);

}

function homeDefaultDay(){
  const s = new Date(S.trip.startDate+"T00:00:00");
  const today = pqToday();
  if(today < s) return 0;
  return Math.min(Math.max(Math.round((today-s)/86400e3),0), dayCount()-1);
}

}
function spentKrw(){
  return S.expenses.reduce((a,x)=>a+(x.cur==="₩" ? +x.amt : (+x.amt)*EX_RATE), 0);

function renderHome(){
  const s = new Date(S.trip.startDate+"T00:00:00");
  const e = new Date(S.trip.endDate+"T00:00:00");
  const today = pqToday();
  const over = today > e;
  const feedPages = Math.max(1, Math.ceil(S.feed.length/3));
  if(feedPage >= feedPages) feedPage = feedPages-1;
  const feedPageItems = S.feed.slice(feedPage*3, feedPage*3+3);
  const tip = over ? "여행 다녀오느라 고생했어요! 아래 <b>추억 앨범</b>에 한 줄씩 남겨봐요 ✍️"
    : KKOU_TIPS[(window._tipIdx==null ? (window._tipIdx=new Date().getDate()%KKOU_TIPS.length) : window._tipIdx)];

  /* ---- 추억 앨범 (여행 종료 후) ---- */
  const memCard = !over ? "" : `
    <div class="card">
      <div class="sec-title">📸 우리 가족 추억 앨범</div>
      ${Array.from({length:dayCount()},(_,i)=>{
        const its=dayItems(i);

        return `<div class="mem-day">
          <b>DAY ${i+1} · ${fmtDate(dayDate(i),{month:"numeric",day:"numeric"})}</b>

  if(!over) loadWeather();
  loadFx();
  loadNews();
}

/* ---------- 지출 기록 ---------- */
function expWhenLabel(){
  const s=new Date(S.trip.startDate+"T00:00:00"), e=new Date(S.trip.endDate+"T00:00:00");
  const today=pqToday();
  if(today<s) return "여행 전";
  if(today>e) return "여행 후";
  return "DAY "+(Math.round((today-s)/86400e3)+1);
}
function openExpense(){
  window._expCur="₫"; window._expCat="기타";
  $("#modalRoot").innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>💸 지출 기록<button class="x" onclick="closeModal()">✕</button></h2>
      <label class="f-label">무엇에 썼나요? *</label>
      <input class="f-input" id="exTitle" placeholder="예: 야시장 저녁, 항공권" maxlength="30">
      <label class="f-label">금액</label>
      <div class="searchrow">
        <input class="f-input" type="number" id="exAmt" inputmode="numeric" placeholder="예: 500000">
        <div class="seg" id="exCur" style="flex:0 0 130px">
          <button data-c="₫" class="sel">₫ 동</button>
          <button data-c="₩">₩ 원</button>
        </div>
      </div>
      <div class="krw-hint" id="exHint"></div>
      <label class="f-label">카테고리</label>
      <div class="cat-grid" id="exCats">
        ${Object.entries(CATS).map(([k,v])=>`<button class="cat-opt ${k==="기타"?"sel":""}" data-c="${k}"><span class="e">${v.e}</span><span class="n">${k}</span></button>`).join("")}
      </div>
      <div class="imp-hint">🗓 시기는 자동으로 <b>${expWhenLabel()}</b>(으)로 기록돼요. 여행 전에 쓴 항공권·예약금도 지금 입력하면 돼요!</div>
      <button class="btn-primary" onclick="saveExpense()">기록하기 💸</button>
    </div>
  </div>`;
  $("#exCur").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    window._expCur=b.dataset.c;
    $("#exCur").querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));
    updateExHint();
  });
  $("#exCats").querySelectorAll(".cat-opt").forEach(b=>b.onclick=()=>{
    window._expCat=b.dataset.c;
    $("#exCats").querySelectorAll(".cat-opt").forEach(x=>x.classList.toggle("sel",x===b));
  });
  $("#exAmt").oninput=updateExHint;
  setTimeout(()=>$("#exTitle").focus(),250);
}
function updateExHint(){
  const v=+$("#exAmt").value||0;
  $("#exHint").textContent = (v&&window._expCur==="₫") ? "≈ "+Math.round(v*EX_RATE).toLocaleString("ko-KR")+"원" : "";
}
function saveExpense(){
  const amt=+$("#exAmt").value;
  const title=$("#exTitle").value.trim();
  if(!title){ $("#exTitle").style.borderColor="var(--danger)"; $("#exTitle").focus(); return; }
  if(!(amt>0)){ $("#exAmt").style.borderColor="var(--danger)"; $("#exAmt").focus(); return; }
  const x={id:"x"+Date.now(), title, amt, cur:window._expCur, category:window._expCat||"기타",
    when:expWhenLabel(), ts:Date.now(), by:meId};
  S.expenses.push(x);
  addFeed(`지출 '${title}'을(를) 기록했어요 💸`);
  syncExpense(x); closeModal(); renderHome();
  toast("지출을 기록했어요 💸");
}
let expUndo=null;
function delExpense(id){
  const i=S.expenses.findIndex(x=>x.id===id); if(i<0) return;
  expUndo=S.expenses[i];
  S.expenses.splice(i,1);
  syncDeleteExpense(id); renderHome();
  toast("지출 기록을 삭제했어요", ()=>{
    if(!expUndo) return;
    const x=expUndo; expUndo=null;
    S.expenses.push(x); syncExpense(x); renderHome(); toast("되돌렸어요! 😊");
  });
}
function syncExpense(x){
  save();
  if(FB.on) roomRef().collection("expenses").doc(x.id).set(JSON.parse(JSON.stringify(x))).catch(fbErr);
}
function syncDeleteExpense(id){
  save();
  if(FB.on) roomRef().collection("expenses").doc(id).delete().catch(fbErr);
}

function openTripSettings(){
  $("#modalRoot").innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">

      </div>
      <div class="imp-hint">📌 기간을 줄이면 범위를 벗어난 일정은 지워지지 않고 <b>마지막 날로 이동</b>해요. 날짜를 바꾸면 D-Day·날씨·DAY 탭이 모두 자동으로 맞춰집니다.</div>
      <button class="btn-primary" onclick="saveTripSettings()">저장하기 ✈️</button>
      <div id="tsMsg"></div>
    </div>
  </div>`;
}
function saveTripSettings(){
  const t=$("#tsTitle").value.trim()||"푸꾸옥 꼬우!";
  const s=$("#tsStart").value, e=$("#tsEnd").value;
  const msg=$("#tsMsg");
  if(!s||!e){ msg.innerHTML=`<div class="imp-msg">⚠️ 시작일과 종료일을 모두 골라주세요</div>`; return; }
  if(e<s){ msg.innerHTML=`<div class="imp-msg">⚠️ 종료일이 시작일보다 빨라요</div>`; return; }
  const days=Math.round((new Date(e)-new Date(s))/86400e3)+1;
  if(days>30){ msg.innerHTML=`<div class="imp-msg">⚠️ 여행 기간은 최대 30일까지 가능해요</div>`; return; }
  S.trip.title=t; S.trip.startDate=s; S.trip.endDate=e;
  const moved=[];
  S.items.forEach(it=>{ if(it.dayIndex>=days){ it.dayIndex=days-1; moved.push(it); } });
  curDay=Math.min(curDay, days-1);
  if(mapDay>=days) mapDay=days-1;
  save();
  if(FB.on){
    roomRef().update({title:t, startDate:s, endDate:e}).catch(fbErr);
    if(moved.length) syncItems(...moved);
  }
  addFeed("여행 정보를 수정했어요 🛠");
  closeModal(); renderAll();
  toast(moved.length?`저장 완료! 범위 밖 일정 ${moved.length}개는 마지막 날로 옮겼어요`:"여행 정보를 저장했어요 ✈️");
}

async function loadFx(){
  const box=$("#fxBox"); if(!box) return;
  const draw=(usd, vnd10k, when, live)=>{
    box.innerHTML=`
      <div class="fx-row"><span>🇺🇸 1달러 (USD)</span><span class="v">${Math.round(usd).toLocaleString("ko-KR")}원</span></div>
      <div class="fx-row"><span>🇻🇳 1만 동 (VND)</span><span class="v">${Math.round(vnd10k).toLocaleString("ko-KR")}원</span></div>
      <div class="map-note" style="text-align:left;margin-top:6px">${live
        ? esc(when)+" 기준 실시간 환율 — 앱의 동↔원 계산에도 자동 적용돼요"
        : "환율을 불러오지 못해 기본값(1만₫≈"+Math.round(10000*EX_RATE)+"원)으로 표시 중이에요"}</div>`;
  };
  try{
    let fx=null;
    try{ fx=JSON.parse(localStorage.getItem("pqgo_fx")||"null"); }catch(e){}
    if(!fx || !fx.krw || !fx.vnd || Date.now()-fx.ts > 6*3600e3){
      const r=await fetch("https://open.er-api.com/v6/latest/USD");
      const j=await r.json();
      if(!j.rates || !j.rates.KRW || !j.rates.VND) throw 0;
      fx={ts:Date.now(), krw:j.rates.KRW, vnd:j.rates.VND};
      localStorage.setItem("pqgo_fx", JSON.stringify(fx));
    }
    const newRate=fx.krw/fx.vnd;
    const changed=Math.abs(newRate-EX_RATE)/EX_RATE>0.005;
    EX_RATE=newRate; window._fx=fx; runConv();
    draw(fx.krw, 10000*newRate,
      new Date(fx.ts).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+" "+new Date(fx.ts).getHours()+"시", true);
    if(changed && !loadFx._re){ loadFx._re=true; renderHome(); }
  }catch(e){
    window._fx = window._fx || {krw:1350, vnd:Math.round(1350/EX_RATE)};
    draw(window._fx.krw, 10000*EX_RATE, "", false); runConv();
  }
}

function runConv(){
  const amtEl=$("#cvAmt"); if(!amtEl) return;
  const amt=+amtEl.value||0, from=$("#cvFrom").value, to=$("#cvTo").value, out=$("#cvOut");
  const sym={KRW:"원",USD:"달러",VND:"동"};
  if(!amt){ out.textContent=""; return; }
  const fx=window._fx; if(!fx){ out.textContent="환율 불러오는 중…"; return; }
  const usd = from==="USD"?amt : from==="KRW"?amt/fx.krw : amt/fx.vnd;
  const res = to==="USD"?usd : to==="KRW"?usd*fx.krw : usd*fx.vnd;
  const fmt = c=> c==="USD"? res.toFixed(2) : Math.round(res).toLocaleString("ko-KR");
  out.innerHTML = `${amt.toLocaleString("ko-KR")}${sym[from]} ≈ <b>${fmt(to)}${sym[to]}</b>`;
}

  const box=$("#nearBox"); if(!box) return;
  if(!navigator.geolocation){ box.innerHTML=nearFallback("이 브라우저는 위치 기능을 지원하지 않아요"); return; }
  box.innerHTML=`<div class="imp-msg"><span class="spin">🥥</span> 내 위치 확인 중… (위치 사용을 허용해주세요)</div>`;
  navigator.geolocation.getCurrentPosition(async pos=>{
    myLoc={lat:pos.coords.latitude, lng:pos.coords.longitude};
    box.innerHTML=`<div class="imp-msg"><span class="spin">🥥</span> 주변 음식점을 찾는 중…</div>`;

      const q=`[out:json][timeout:12];(node["amenity"~"restaurant|fast_food|food_court"]["name"](around:3000,${myLoc.lat},${myLoc.lng}););out 40;`;
      const r=await fetch("https://overpass-api.de/api/interpreter",{
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)});
      const j=await r.json();
      const list=(j.elements||[])
        .filter(e=>e.tags&&e.tags.name)
        .map(e=>({name:e.tags.name, cuisine:(e.tags.cuisine||"").split(";")[0].replace(/_/g," "),
          lat:e.lat, lng:e.lon, km:havKm(myLoc,{lat:e.lat,lng:e.lon})}))
        .sort((a,b)=>a.km-b.km).slice(0,12);
      if(!list.length){ box.innerHTML=nearFallback("주변 3km 안에서 등록된 음식점을 찾지 못했어요"); return; }
      box.innerHTML=`<a class="res-item" style="text-decoration:none;color:inherit;background:var(--teal-light);border-radius:12px;padding:10px" target="_blank" rel="noopener"
          href="https://www.google.com/maps/search/${encodeURIComponent("맛집")}/@${myLoc.lat},${myLoc.lng},15z">
          <span class="pin">⭐</span>
          <div><div class="nm2">구글지도에서 평점·리뷰순으로 보기</div>
          <div class="ad">구글지도가 주변 맛집을 평점 기준으로 보여줘요</div></div>
          <span class="go">열기 ›</span></a>` + list.map(x=>`
        <a class="res-item" style="text-decoration:none;color:inherit" target="_blank" rel="noopener"

function renderPlan(){
  const n = dayCount();
  let tabs = "";
  for(let i=0;i<n;i++){
    const d = dayDate(i);
    tabs += `<button class="day-tab ${i===curDay?"active":""}" onclick="setDay(${i})">
      <div class="d">DAY ${i+1}</div><div class="dt">${fmtDate(d,{month:"numeric",day:"numeric",weekday:"short"})}</div></button>`;
  }
  const items = dayItems(curDay);
  const carry = curDay>0 ? dayItems(curDay-1).filter(x=>x.endNextDay) : [];  // 전날 밤부터 이어지는 일정
  const disp = [...carry.map(x=>({it:x,carry:true})), ...items.map(x=>({it:x,carry:false}))];
  const isToday = dayDate(curDay).toDateString() === pqToday().toDateString();
  const nmin = pqNowMin();
  let nowId = null;
  if(isToday){
    for(const d of disp){
      let endM = toMin(d.it.endTime)!=null ? toMin(d.it.endTime) : toMin(d.it.startTime);
      if(endM!=null && d.it.endNextDay && !d.carry) endM += 1440;
      if(endM!=null && endM < nmin) continue;
      nowId = d.it.id; break;
    }
  }
  $("#view-plan").innerHTML = `
    <div class="day-tabs">${tabs}</div>
    <div class="day-head">
      <span class="t">DAY ${curDay+1} · ${fmtDate(dayDate(curDay))}</span>
      <button class="sort-btn" style="margin-left:auto;background:#FFF0E9;color:var(--coral-dark)" onclick="openImport()">📥 가져오기</button>
      <button class="sort-btn" style="margin-left:0" onclick="sortByTime()">🕐 시간순</button>
    </div>
    ${disp.length ? `<div class="timeline">${disp.map((d,idx)=>tItem(d.it,idx,disp.length,isToday,nowId,nmin,d.carry)).join("")}</div>`
      : `<div class="placeholder"><span class="big">🌊</span><h3>DAY ${curDay+1}은 아직 비어있어요</h3><p>＋ 버튼으로 직접 추가하거나<br>구글지도 링크·메모를 붙여넣어 가져와보세요!</p>
        <button class="stage-badge" style="border:none;cursor:pointer" onclick="openImport()">📥 일정 가져오기</button></div>`}
    ${items.length?`<div class="map-note">카드를 <b>꾹 눌러 위아래로 끌면</b> 순서가 바뀌어요${carry.length?" · 🌙는 전날부터 이어지는 일정":""}</div>`:""}
    <div class="card" style="margin-top:6px"><div class="sec-title">🗺️ 동선 보기</div><div id="planMapHost"></div></div>
    <div style="height:70px"></div>`;
  bindPlanDrag();
  mapDay = curDay; renderMap();
  const _at=document.querySelector("#view-plan .day-tab.active"); if(_at) _at.scrollIntoView({inline:"center",block:"nearest"});
  if(window._scrollPlan){
    window._scrollPlan=false;
    setTimeout(()=>{ const nel=document.querySelector(".titem.now"); if(nel) nel.scrollIntoView({behavior:"smooth", block:"center"}); },120);
  }
}
function setDay(i){ curDay = i; window._scrollPlan=true; renderPlan(); }
function refreshNowState(){
  if(curView!=="plan" || window._dragActive) return;
  const items=dayItems(curDay);
  const carry=curDay>0?dayItems(curDay-1).filter(x=>x.endNextDay):[];
  const disp=[...carry.map(x=>({it:x,carry:true})),...items.map(x=>({it:x,carry:false}))];
  const isToday = dayDate(curDay).toDateString()===pqToday().toDateString();
  const nmin=pqNowMin();
  const eff=(it,c)=>{ let e=toMin(it.endTime)!=null?toMin(it.endTime):toMin(it.startTime); if(e!=null&&it.endNextDay&&!c)e+=1440; return e; };
  let nowId=null;
  if(isToday){ for(const d of disp){ const e=eff(d.it,d.carry); if(e!=null&&e<nmin) continue; nowId=d.it.id; break; } }
  document.querySelectorAll("#view-plan .timeline .titem").forEach(el=>{
    const c=el.classList.contains("carry");
    const it=(c?carry:items).find(x=>x.id===el.dataset.id); if(!it) return;
    const e=eff(it,c);
    el.classList.toggle("past", isToday&&e!=null&&e<nmin);
    el.classList.toggle("now", isToday&&it.id===nowId);
  });
}
setInterval(refreshNowState, 60000);

/* ---------- 꾹 눌러 순서 변경 (롱프레스 드래그) ---------- */
function bindPlanDrag(){
  const tl=document.querySelector("#view-plan .timeline");
  if(!tl || tl._bound) return; tl._bound=true;
  tl.oncontextmenu=e=>{ if(window._dragActive) e.preventDefault(); };
  let timer=null, el=null, active=false, sy=0, sx=0;
  const blockScroll=e=>{ if(active) e.preventDefault(); };
  function cleanup(){
    clearTimeout(timer); timer=null;
    document.removeEventListener("touchmove", blockScroll);
    window._dragActive=false;
    if(el){ el.classList.remove("lift"); el.style.transform=""; }
  }
  function finish(){
    const ids=[...tl.querySelectorAll(".titem:not(.carry)")].map(x=>x.dataset.id);
    const list=dayItems(curDay);
    const orders=list.map(x=>x.order).sort((a,b)=>a-b);
    const changed=[];
    ids.forEach((id,k)=>{ const it=list.find(x=>x.id===id); if(it && it.order!==orders[k]){ it.order=orders[k]; changed.push(it); } });
    cleanup(); el=null; active=false;
    if(changed.length){ syncItems(...changed); toast("순서를 바꿨어요 ↕️"); }
    renderPlan();
  }
  tl.addEventListener("pointerdown", e=>{
    const card=e.target.closest(".titem");
    if(!card || card.classList.contains("carry") || e.target.closest("button,input,textarea,a")) return;
    el=card; sy=e.clientY; sx=e.clientX; active=false;
    timer=setTimeout(()=>{
      active=true; window._dragActive=true;
      el.classList.add("lift");
      if(navigator.vibrate) try{navigator.vibrate(30);}catch(_){ }
      document.addEventListener("touchmove", blockScroll, {passive:false});
      try{ el.setPointerCapture(e.pointerId); }catch(_){ }
    }, 420);
  });
  tl.addEventListener("pointermove", e=>{
    if(!el) return;
    if(!active){
      if(Math.abs(e.clientY-sy)>8 || Math.abs(e.clientX-sx)>8){ clearTimeout(timer); el=null; }
      return;
    }
    e.preventDefault();
    el.style.transform="";                         // 자연 위치 측정
    const r=el.getBoundingClientRect();
    const center=r.top+r.height/2;
    el.style.transform=`translateY(${(e.clientY-center).toFixed(1)}px)`;  // 손가락에 고정
    const sibs=[...tl.querySelectorAll(".titem")].filter(s=>s!==el);
    for(const s of sibs){
      const sr=s.getBoundingClientRect();
      if(e.clientY>sr.top && e.clientY<sr.bottom){
        const before = e.clientY < sr.top+sr.height/2;
        if(before && s.previousElementSibling!==el) tl.insertBefore(el,s);
        else if(!before && s.nextElementSibling!==el) tl.insertBefore(el,s.nextSibling);
        break;
      }
    }
  });
  const up=()=>{ if(!el){ clearTimeout(timer); return; } if(active){ finish(); } else { cleanup(); el=null; } };
  tl.addEventListener("pointerup", up);
  tl.addEventListener("pointercancel", up);
}

function sortByTime(){

  sorted.forEach((x,i)=>x.order=orders[i]);

  f.title = title;

    const dayChanged = S.items[i].dayIndex !== f.dayIndex;

  }else{

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAyOMhK5GIK5Sd_ggkLCOq02yMjfGxI_oU",
  authDomain: "phuquoc-1bbde.firebaseapp.com",

const FB = {on:false, status:"off", db:null, code:null, unsub:[], err:null};

function getFbConfig(){
  if(FIREBASE_CONFIG) return FIREBASE_CONFIG;
  try{ const s=localStorage.getItem("pqgo_fbcfg"); if(s) return JSON.parse(s); }catch(e){}
  return null;

function parseFbConfig(txt){
  const cfg={}; const re=/["']?([A-Za-z]\w+)["']?\s*:\s*["']([^"']+)["']/g; let m;
  while((m=re.exec(txt))) cfg[m[1]]=m[2];
  return (cfg.apiKey && cfg.projectId) ? cfg : null;
}
function loadFb(){
  if(window.firebase && firebase.firestore) return Promise.resolve(true);
  if(loadFb._p) return loadFb._p;
  const urls=[
    "https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js",
    "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js",
    "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"];
  loadFb._p=(async()=>{
    for(const u of urls){
      const ok=await new Promise(res=>{
        const s=document.createElement("script"); s.src=u;
        const to=setTimeout(()=>res(false),9000);
        s.onload=()=>{clearTimeout(to);res(true)}; s.onerror=()=>{clearTimeout(to);res(false)};
        document.head.appendChild(s);
      });
      if(!ok) return false;
    }
    return true;
  })();
  return loadFb._p;
}
function safeRenderAll(){
  const ae=document.activeElement;
  const typing = ae && (ae.id==="pkText" || (ae.classList&&(ae.classList.contains("diary-input")||ae.classList.contains("cmt-in"))));

document.addEventListener("focusout", ()=>setTimeout(()=>{

},120));
async function fbConnect(code, create){
  const cfg=getFbConfig();
  if(!cfg){ toast("먼저 Firebase 설정을 붙여넣어주세요 ⚙️"); return false; }
  FB.status="connecting"; FB.err=null;
  if(curView==="family") renderFamily();
  const ok=await loadFb();
  if(!ok){
    FB.status="error"; FB.err="Firebase 스크립트를 불러오지 못했어요 — 인터넷 연결을 확인해주세요";
    if(curView==="family") renderFamily(); return false;
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    try{ await firebase.auth().signInAnonymously(); }catch(e){ /* 익명 로그인 미설정이면 테스트 모드 규칙으로 진행 */ }
    FB.db=firebase.firestore();
    const ref=FB.db.collection("trips").doc(code);
    if(create){
      await ref.set({ title:S.trip.title, startDate:S.trip.startDate, endDate:S.trip.endDate,
        members:S.trip.members, createdAt:Date.now() });
      const batch=FB.db.batch();
      S.items.forEach(it=>batch.set(ref.collection("items").doc(it.id), JSON.parse(JSON.stringify(it))));
      S.pack.forEach(p=>batch.set(ref.collection("pack").doc(p.id), JSON.parse(JSON.stringify(p))));
      S.expenses.forEach(x=>batch.set(ref.collection("expenses").doc(x.id), JSON.parse(JSON.stringify(x))));
      batch.set(ref.collection("meta").doc("diary"), JSON.parse(JSON.stringify(S.diary||{})));
      await batch.commit();
    }else{
      const snap=await ref.get();
      if(!snap.exists){
        FB.status="error"; FB.err=`'${code}' 코드의 여행방을 찾을 수 없어요 — 코드를 다시 확인해주세요`;
        if(curView==="family") renderFamily(); return false;
      }
    }
    FB.code=code; FB.on=true; FB.status="on";
    localStorage.setItem("pqgo_room", code);
    attachFb(ref);
    if(curView==="family") renderFamily();
    return true;
  }catch(e){
    FB.status="error"; FB.on=false;
    FB.err = (e&&e.code==="permission-denied")
      ? "권한이 없어요 — Firestore를 '테스트 모드'로 만들었는지 확인해주세요"
      : "연결 실패: "+((e&&e.message)||e);
    if(curView==="family") renderFamily();
    return false;
  }
}
function attachFb(ref){
  FB.unsub.forEach(u=>{try{u()}catch(e){}}); FB.unsub=[];
  FB.unsub.push(ref.onSnapshot(d=>{
    if(!d.exists) return;
    const t=d.data();
    S.trip={...S.trip, title:t.title||S.trip.title, startDate:t.startDate||S.trip.startDate,
      endDate:t.endDate||S.trip.endDate, members:(t.members&&t.members.length)?t.members:S.trip.members};
    save(); safeRenderAll();
  }, fbErr));
  FB.unsub.push(ref.collection("items").onSnapshot(q=>{
    S.items=q.docs.map(d=>d.data()); save(); safeRenderAll();
  }, fbErr));
  window._feedReady=false;
  FB.unsub.push(ref.collection("feed").orderBy("ts","desc").limit(15).onSnapshot(q=>{
    const prevTop=(S.feed[0]&&S.feed[0].ts)||0;
    S.feed=q.docs.map(d=>d.data());
    if(window._feedReady) maybeNotify(S.feed.filter(f=>f.ts>prevTop));
    window._feedReady=true;
    save(); safeRenderAll();
  }, fbErr));
  FB.unsub.push(ref.collection("pack").onSnapshot(q=>{
    S.pack=q.docs.map(d=>d.data()); save(); safeRenderAll();
  }, fbErr));
  FB.unsub.push(ref.collection("expenses").onSnapshot(q=>{
    S.expenses=q.docs.map(d=>d.data()); save(); safeRenderAll();
  }, fbErr));
  FB.unsub.push(ref.collection("meta").doc("diary").onSnapshot(d=>{
    if(d.exists){ S.diary=d.data()||{}; save(); safeRenderAll(); }
  }, fbErr));
}
function fbErr(e){
  FB.status="error";
  FB.err = (e&&e.code==="permission-denied") ? "권한 오류 — Firestore 규칙을 확인해주세요" : ((e&&e.message)||"연결 오류");
  if(curView==="family") renderFamily();
}

/* 무료 지오코딩 (OpenStreetMap Nominatim, API키 불필요) — 푸꾸옥 주변 우선 */
async function geocode(q){
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ko"
    + "&viewbox=103.50,10.70,104.40,9.70&bounded=0&q=" + encodeURIComponent(q);
  const r = await fetch(url, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("http "+r.status);
  const arr = await r.json();
  return arr.map(x=>({
    name: x.name || String(x.display_name||"").split(",")[0].trim() || q,
    addr: String(x.display_name||"").split(",").slice(0,3).join(",").trim(),
    lat:+x.lat, lng:+x.lon,
  }));
}

/* 구글지도 공유 텍스트/URL 분석 */
function parseGmapsShare(txt){
  const out = {url:null, shortLink:false, name:null, lat:null, lng:null, freeText:null};
  const um = txt.match(/https?:\/\/\S+/);
  if(um){
    out.url = um[0];
    out.shortLink = /(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/)/.test(out.url);
    let dec = out.url;
    try{ dec = decodeURIComponent(out.url); }catch(e){}
    const nm = dec.match(/\/maps\/place\/([^\/@?]+)/);
    if(nm) out.name = nm[1].replace(/\+/g," ").trim();
    const pin = dec.match(/!3d(-?\d{1,2}\.\d+)[^!]*!4d(-?\d{1,3}\.\d+)/);
    const at  = dec.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
    const qm  = dec.match(/[?&]q=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
    const c = pin||qm||at;
    if(c){ out.lat=+c[1]; out.lng=+c[2]; }
  }
  // URL 앞뒤의 텍스트(카톡 공유 메시지의 장소 이름)
  const rest = txt.replace(/https?:\/\/\S+/g," ").replace(/\s+/g," ").trim();
  if(rest) out.freeText = rest.split("\n")[0].slice(0,60);
  if(!out.name && !out.url && rest) out.name = rest;
  return out;
}

/* 자유 텍스트 → 일정 초안 */
function guessCat(t){
  if(/조식|점심|저녁|식당|맛집|국수|분짜|반쎄오|먹|밥|디너|런치/.test(t)) return "식사";
  if(/카페|커피|디저트|빙수/.test(t)) return "카페";
  if(/호텔|체크인|체크아웃|숙소|리조트/.test(t)) return "숙소";
  if(/공항|이동|택시|그랩|버스|선착장|출발|도착/.test(t)) return "이동";
  if(/시장|쇼핑|기념품|마트/.test(t)) return "쇼핑";
  if(/스노클|다이빙|카약|투어|워터파크|케이블카|스파|마사지/.test(t)) return "액티비티";
  return "관광";
}
function parseFreeText(txt){
  const out = [];
  let idx = curDay;
  const pieces = txt.split(/[\n,·]+/).map(s=>s.trim()).filter(Boolean);
  for(let piece of pieces){
    const dm = piece.match(/(\d{1,2})\s*[\/월.]\s*(\d{1,2})\s*일?/);
    if(dm){
      const mo=+dm[1], da=+dm[2];
      for(let i=0;i<dayCount();i++){
        const d=dayDate(i);
        if(d.getMonth()+1===mo && d.getDate()===da){ idx=i; break; }
      }
      piece = piece.replace(dm[0],"").trim();
    }
    let st="";
    const tm = piece.match(/(오전|오후)?\s*(\d{1,2})\s*(?::(\d{2})|시\s*반|시\s*(?:(\d{1,2})\s*분)?)/);
    if(tm){
      let h=+tm[2], mi=+(tm[3]||tm[4]||0);
      if(/시\s*반/.test(tm[0])) mi=30;
      if(tm[1]==="오후" && h<12) h+=12;
      if(tm[1]==="오전" && h===12) h=0;
      if(h<24){ st=String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0"); }
      piece = piece.replace(tm[0],"").trim();
    }
    const title = piece.replace(/^[-~:.\s]+|[-~:.\s]+$/g,"").trim();
    if(!title) continue;
    out.push({dayIndex:idx, startTime:st, title, category:guessCat(title)});
  }
  return out;
}

  const R=6371, r=x=>x*Math.PI/180;
  const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

    </div>

}
const MAP_HOST = "#planMapHost";

      <div class="map-note" style="margin-top:8px">✏️에서 장소 이름을 쓰고 🔍 검색하면 자동으로 지도에 표시돼요</div></div>`:""}

  MapCtl.box = $("#mapBox");

function setMapDay(i){ mapDay=i; renderMap(); }

/* ---------- 지도 그리기 ---------- */
async function buildMap(){
  const box = MapCtl.box; if(!box) return;
  const ok = await loadLeaflet();
  if(box !== $("#mapBox")) return;           // 탭이 바뀐 경우
  if(ok){ buildLeaflet(box); } else { buildSvg(box); }
  buildAnimPath();
}
function daysToDraw(){
  const n=dayCount(), arr=[];
  if(mapDay>=0) arr.push(mapDay); else for(let i=0;i<n;i++) arr.push(i);
  return arr;
}
function buildLeaflet(box){
  MapCtl.mode="leaflet";
  if(MapCtl.map){ MapCtl.map.remove(); MapCtl.map=null; }
  box.innerHTML="";
  const map = L.map(box,{zoomControl:false, attributionControl:false});
  L.control.attribution({prefix:false}).addAttribution("© OpenStreetMap").addTo(map);
  let loaded=false, failed=false;
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18});
  tiles.on("tileload",()=>loaded=true);
  tiles.on("tileerror",()=>{
    if(!loaded && !failed){ failed=true; setTimeout(()=>{ if(!loaded && box===$("#mapBox")) buildSvg(box); },1200); }
  });
  tiles.addTo(map);
  MapCtl.map = map;
  const bounds=[];
  daysToDraw().forEach(d=>{
    const pts=coordItems(d), col=DAY_COLORS[d%7], small=mapDay<0;
    if(pts.length>1) L.polyline(pts.map(p=>[p.place.lat,p.place.lng]),
      {color:col, weight:small?3:4.5, opacity:.85, dashArray:small?"6 6":null}).addTo(map);
    pts.forEach((p,i)=>{
      bounds.push([p.place.lat,p.place.lng]);
      L.marker([p.place.lat,p.place.lng],{icon:L.divIcon({
        html:`<div class="mk ${small?"small":""}" style="background:${col}">${i+1}</div>`,
        iconSize:[small?19:26,small?19:26], iconAnchor:[small?10:13,small?10:13]})})
        .addTo(map).bindPopup(`<b>${esc(p.title)}</b><br>${p.startTime||""} ${esc(p.place.name||"")}`);
    });
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[34,34]});
  else map.setView([10.17,103.97],10);
  $("#mapNote").textContent = "지도: OpenStreetMap (무료 · API 키 불필요)";
  MapCtl.mover=null;
}
/* ---------- 오프라인 약식 지도 (SVG) ---------- */
const SVG_BOUNDS = {latTop:10.48, latBot:9.88, lngL:103.80, lngR:104.12, w:100, h:132};
function proj(lat,lng){
  const B=SVG_BOUNDS;
  return { x:(lng-B.lngL)/(B.lngR-B.lngL)*B.w, y:(B.latTop-lat)/(B.latTop-B.latBot)*B.h };
}
function buildSvg(box){
  MapCtl.mode="svg";
  if(MapCtl.map){ MapCtl.map.remove(); MapCtl.map=null; }
  let lines="";
  daysToDraw().forEach(d=>{
    const pts=coordItems(d);
    if(pts.length>1){
      const pathD = pts.map((p,i)=>{const c=proj(p.place.lat,p.place.lng); return (i?"L":"M")+c.x.toFixed(1)+","+c.y.toFixed(1);}).join(" ");
      lines+=`<path d="${pathD}" fill="none" stroke="${DAY_COLORS[d%7]}" stroke-width="1.1" stroke-dasharray="${mapDay<0?"2 2":"none"}" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    }
  });
  let marks="";
  daysToDraw().forEach(d=>{
    const pts=coordItems(d), col=DAY_COLORS[d%7], small=mapDay<0;
    pts.forEach((p,i)=>{
      const c=proj(p.place.lat,p.place.lng);
      marks+=`<div class="mk ${small?"small":""} svg-mk" style="background:${col};left:${c.x/SVG_BOUNDS.w*100}%;top:${c.y/SVG_BOUNDS.h*100}%" title="${esc(p.title)}">${i+1}</div>`;
    });
  });
  box.innerHTML=`
   <svg viewBox="0 0 100 132" style="position:absolute;inset:0;width:100%;height:100%" preserveAspectRatio="none">
    <defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BEE6EE"/><stop offset="1" stop-color="#8FCFDE"/></linearGradient></defs>
    <rect width="100" height="132" fill="url(#sea)"/>
    <path d="M30,6 C44,3 58,5 66,13 C72,20 74,32 71,42 C68,52 64,58 62,66 C60,74 64,80 70,86 C77,92 80,95 78,100 C76,104 70,106 66,107 C62,107 59,103 57,97 C55,90 52,83 49,76 C46,68 44,60 43,52 C42,44 38,38 30,33 C22,29 15,27 12,20 C10,14 18,8 30,6 Z"
      fill="#E8F0CF" stroke="#B9D3A0" stroke-width=".8"/>
    <ellipse cx="67" cy="115" rx="4.5" ry="5.5" fill="#E8F0CF" stroke="#B9D3A0" stroke-width=".8"/>
    <text x="26" y="24" font-size="4.6" fill="#7FA86E" font-weight="bold" font-style="italic">Phú Quốc</text>
    <text x="8" y="122" font-size="3.4" fill="#5FA3B5" font-style="italic">🌊 약식 지도 모드</text>
    ${lines}
   </svg>${marks}`;
  const note=$("#mapNote"); if(note) note.textContent="오프라인 약식 지도예요 — 인터넷이 연결되면 실제 지도로 표시돼요";
  MapCtl.mover=null;
}

/* ---------- 동선 재생 애니메이션 ---------- */
function buildAnimPath(){
  anim.path=[]; anim.t=0;
  if(mapDay<0) return;
  const pts=coordItems(mapDay);
  if(pts.length<2) return;
  let lastMin = toMin(pts[0].startTime) ?? 9*60;
  anim.path = pts.map(p=>{
    let m = toMin(p.startTime);
    if(m==null || m<lastMin) m = lastMin+30;
    lastMin=m;
    return {lat:p.place.lat, lng:p.place.lng, min:m, title:p.title};
  });
}
function updateMover(){
  if(anim.path.length<2) return;
  const segs=anim.path.length-1;
  const pos=Math.min(anim.t,0.9999)*segs;
  const i=Math.floor(pos), f=pos-i;
  const a=anim.path[i], b=anim.path[i+1];
  const lat=a.lat+(b.lat-a.lat)*f, lng=a.lng+(b.lng-a.lng)*f;
  const nowMin=a.min+(b.min-a.min)*f;
  if(MapCtl.mode==="leaflet" && MapCtl.map){
    if(!MapCtl.mover){
      MapCtl.mover=L.marker([lat,lng],{zIndexOffset:1000,icon:L.divIcon({html:'<div class="mover"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(MapCtl.map);
    } else MapCtl.mover.setLatLng([lat,lng]);
  }else if(MapCtl.mode==="svg" && MapCtl.box){
    if(!MapCtl.mover){
      MapCtl.mover=document.createElement("div");
      MapCtl.mover.className="mover svg-mover";
      MapCtl.box.appendChild(MapCtl.mover);
    }
    const c=proj(lat,lng);
    MapCtl.mover.style.left=c.x/SVG_BOUNDS.w*100+"%";
    MapCtl.mover.style.top=c.y/SVG_BOUNDS.h*100+"%";
  }
  const tl=$("#playTime"), nw=$("#playNow"), sl=$("#playSlider");
  if(tl) tl.textContent=minToStr(nowMin);
  if(sl) sl.value=Math.round(anim.t*1000);
  if(nw) nw.textContent = f<0.15 ? `📍 ${a.title}` : (f>0.85 ? `📍 ${b.title}` : `🚕 ${a.title} → ${b.title} 이동 중…`);
}
function togglePlay(){
  if(anim.playing){ stopAnim(); return; }
  if(anim.path.length<2) return;
  if(anim.t>=0.999) anim.t=0;
  anim.playing=true;
  const btn=$("#playBtn"); if(btn) btn.textContent="⏸";
  const DUR=11000;
  let last=performance.now();
  const step=now=>{
    if(!anim.playing) return;
    anim.t+=(now-last)/DUR; last=now;
    if(anim.t>=1){ anim.t=1; updateMover(); stopAnim(); const nw=$("#playNow"); if(nw) nw.textContent="🏁 하루 동선 재생 완료!"; return; }
    updateMover();
    anim.raf=requestAnimationFrame(step);
  };
  anim.raf=requestAnimationFrame(step);
}
function stopAnim(resetBtn=true){
  anim.playing=false;
  if(anim.raf) cancelAnimationFrame(anim.raf);
  if(resetBtn){ const btn=$("#playBtn"); if(btn) btn.textContent="▶"; }
}

/* ================================================================

let listView = "pack"; // pack | shop
function setListView(v){ listView=v; renderPack(); }

      <div class="sec-title">${isShop?"🛍️ 쇼핑 진행":"🎒 준비 진행"} <small>${done} / ${total} ${isShop?"구매":"완료"}</small></div>
      <div class="prog"><div style="width:${total?Math.round(done/total*100):0}%"></div></div>
      ${total&&done===total?`<div class="map-note">${isShop?"쇼핑 완료! 🛍️":"모두 챙겼어요! 출발 준비 완료 🎉"}</div>`:""}
    </div>
    <div class="card">
      <div class="sec-title">➕ ${noun} 추가</div>
      <div class="addrow">
        <input class="f-input" id="pkText" placeholder="${isShop?'예: 후추, 캐슈넛, 기념품':'예: 선글라스'}" maxlength="30" onkeydown="if(event.key==='Enter')addPack()">
        <select class="f-input" id="pkOwner">
          <option value="">공용</option>
          ${S.trip.members.map(m=>`<option value="${m.id}" ${m.id===meId?"selected":""}>${m.emoji} ${esc(m.nickname)}</option>`).join("")}
        </select>
        <button class="btn-mini" onclick="addPack()">추가</button>
      </div>
    </div>
    <div class="card">
      <div class="sec-title">👨‍👩‍👧 공용 ${noun}</div>
      ${common.length?common.map(row).join(""):`<div class="empty">${isShop?"함께 살 것을 추가해보세요":"공용 준비물을 추가해보세요"}</div>`}
    </div>
    <div class="card">
      <div class="sec-title">${me?me.emoji+" 내":"🙋 내"} ${noun}</div>
      ${mine.length?mine.map(row).join(""):`<div class="empty">위에서 담당을 '${me?esc(me.nickname):"나"}'로 골라 추가해보세요</div>`}
    </div>
    ${others.map(x=>`<div class="card"><div class="sec-title">${x.m.emoji} ${esc(x.m.nickname)} ${noun}</div>${x.list.map(row).join("")}</div>`).join("")}
    <div class="card">
      <div class="sec-title">💡 ${isShop?"쇼핑리스트":"준비물"} 추천 <small>위 담당(공용/내)에 담겨요</small></div>

function curRecoPool(){ return listView==="shop"?SHOP_RECO:PACK_RECO; }
function renderReco(){
  const box=$("#recoBox"); if(!box) return;
  const pool=curRecoPool();
  const have=new Set(S.pack.filter(p=>(p.kind||"pack")===listView).map(p=>p.text));
  box.innerHTML=pool.map((t,i)=> have.has(t)
    ? `<span class="reco-chip done">${t} ✓</span>`
    : `<button class="reco-chip" onclick="addReco(${i})">${t} ＋</button>`).join("");
}
function addReco(i){
  const pool=curRecoPool(); const txt=pool[i]; if(!txt) return;
  const ownerSel=$("#pkOwner"); const owner=ownerSel?(ownerSel.value||null):(meId||null);
  const p={id:"p"+Date.now()+Math.floor(Math.random()*1e3), text:txt, owner, done:false, createdBy:meId, kind:listView};
  S.pack.push(p);
  addFeed(`${listView==="shop"?"쇼핑리스트":"준비물"}에 '${txt}'을(를) 추가했어요 ${listView==="shop"?"🛍️":"🎒"}`);
  syncPack(p); renderPack(); toast("추천을 담았어요!");
}
function togglePack(id){
  const p=S.pack.find(x=>x.id===id); if(!p) return;
  p.done=!p.done; syncPack(p); renderPack();
}
function addPack(){
  const t=$("#pkText").value.trim();
  if(!t){ $("#pkText").focus(); return; }
  const p={id:"p"+Date.now()+Math.floor(Math.random()*1e3), text:t, owner:$("#pkOwner").value||null, done:false, createdBy:meId, kind:listView};
  S.pack.push(p);
  addFeed(`${listView==="shop"?"쇼핑리스트":"준비물"}에 '${t}'을(를) 추가했어요 ${listView==="shop"?"🛍️":"🎒"}`);
  syncPack(p); renderPack(); toast("추가했어요!");
}
function delPack(id){
  const p=S.pack.find(x=>x.id===id); if(!p) return;
  S.pack=S.pack.filter(x=>x.id!==id);
  syncDeletePack(id); renderPack(); toast(`'${p.text}' 삭제됨`);
}

/* ---------- 날씨 (open-meteo, API키 불필요) ---------- */
function wxLabel(c){
  if(c===0) return "맑음"; if(c<=2) return "구름 조금"; if(c===3) return "흐림";
  if(c<=49) return "안개"; if(c<=57) return "이슬비"; if(c<=67) return "비";
  if(c<=82) return "소나기"; return "뇌우";
}
function wxEmoji(c){
  if(c===0) return "☀️"; if(c<=2) return "🌤️"; if(c===3) return "☁️";
  if(c<=49) return "🌫️"; if(c<=57) return "🌦️"; if(c<=67) return "🌧️";
  if(c<=82) return "🌦️"; return "⛈️";
}
function climateNote(m){
  const t=["1월 ☀️ 건기 · 24~31℃ — 최고 시즌!","2월 ☀️ 건기 · 25~32℃","3월 ☀️ 건기 끝 · 26~33℃",
  "4월 🌤️ 무더움 · 27~34℃","5월 🌦️ 우기 시작 · 27~33℃","6월 🌧️ 우기 · 27~32℃",
  "7월 🌧️ 우기 · 26~31℃","8월 🌧️ 우기 · 26~31℃","9월 ⛈️ 우기 절정 · 25~31℃",
  "10월 🌦️ 우기 끝물 · 25~31℃","11월 🌤️ 건기 시작 · 25~31℃","12월 ☀️ 건기 · 24~30℃ — 여행 최적!"];
  return "푸꾸옥 "+t[m-1];
}
async function loadWeather(){
  const box=$("#wxBox"); if(!box) return;
  const today=pqToday();
  const s=new Date(S.trip.startDate+"T00:00:00"), e=new Date(S.trip.endDate+"T00:00:00");
  const validDates = !isNaN(s) && !isNaN(e);
  const month = validDates ? s.getMonth()+1 : (new Date().getMonth()+1);
  const daysTo = validDates ? Math.round((s-today)/86400e3) : NaN;
  // 계절 안내(예보 범위 밖이거나 날짜 미설정일 때)
  const climate = extra => `<div class="imp-hint" style="margin-top:0">${climateNote(month)}${extra?"<br>"+extra:""}</div>`;
  // 여행이 2주 이상 남았거나 날짜가 없으면 계절 안내
  if(isNaN(daysTo) || daysTo>16){
    box.innerHTML = climate(isNaN(daysTo)
      ? "📅 여행 날짜를 정하면 날짜별 예보가 여기에 떠요 (헤더의 날짜를 눌러 설정)"
      : `📅 출발 약 2주 전부터 날짜별 실제 예보가 떠요 (지금 D-${daysTo})`);
    return;
  }
  try{
    const f=d=>d.toISOString().slice(0,10);
    const start = daysTo>0 ? s : today;
    // open-meteo 예보는 오늘 기준 최대 16일까지만 제공 → 그 범위로 자름
    const maxEnd = +today + 16*86400e3;
    const end = new Date(Math.min(+e, maxEnd));
    const partial = +e > maxEnd;   // 여행 뒷부분이 예보 범위를 넘음
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=10.22&longitude=103.96&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FBangkok&start_date=${f(start)}&end_date=${f(end)}`);
    const j=await r.json();
    if(!j.daily||!j.daily.time||!j.daily.time.length) throw 0;
    window._wx = j;
    const dl=j.daily, WK=['일','월','화','수','목','금','토'];
    const days=dl.time.map((t,i)=>({t, code:dl.weather_code[i], max:Math.round(dl.temperature_2m_max[i]),
      min:Math.round(dl.temperature_2m_min[i]), rain:dl.precipitation_probability_max[i]??0}));
    const avgMax=Math.round(days.reduce((a,d)=>a+d.max,0)/days.length);
    const maxRain=Math.max(...days.map(d=>d.rain));
    const head = maxRain>=60 ? `☂️ 여행 중 비 소식 (최대 ${maxRain}%) — 우산 챙기세요`
      : maxRain>=30 ? `🌦️ 가끔 소나기 (최대 ${maxRain}%) · 낮 ${avgMax}°`
      : `☀️ 대체로 맑고 더워요 · 낮 ${avgMax}°`;
    box.innerHTML=`<div class="wx-head">${head}</div>
      <div class="wx">${days.map(d=>{const wd=new Date(d.t+'T00:00:00');
      return `<div class="wd" onclick="openHourly('${d.t}')">
        <div class="wdt">${+d.t.slice(5,7)}/${+d.t.slice(8,10)}<small>(${WK[wd.getDay()]})</small></div>
        <div class="e2">${wxEmoji(d.code)}</div>
        <div class="wl">${wxLabel(d.code)}</div>
        <div class="t1">${d.max}°<span class="lo"> ${d.min}°</span></div>
        <div class="wr ${d.rain>=60?'hi':''}">💧 ${d.rain}%</div></div>`;}).join("")}</div>
      <div class="map-note" style="margin-top:6px">📅 날짜를 누르면 시간별 날씨${partial?" · 뒷부분은 날짜가 가까워지면 채워져요":""}</div>`;
  }catch(err){
    // 실패하면 에러 대신 계절 안내로 대체 (항상 유용한 정보가 보이도록)
    box.innerHTML = climate("📡 실시간 예보를 잠시 못 불러왔어요 — 위는 이달 평균 날씨예요");
  }
}

/* ---------- 가족 탭 ---------- */
function editMe(){
  const m=member(meId); if(!m) return;
  const emojis=AVATARS;
  $("#modalRoot").innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>✏️ 내 이름 바꾸기<button class="x" onclick="closeModal()">✕</button></h2>
      <label class="f-label">닉네임</label>
      <input class="f-input" id="meName" maxlength="8" value="${esc(m.nickname)}">
      <label class="f-label">이모지</label>
      <div class="emoji-grid" style="justify-content:flex-start;max-width:none">
        ${emojis.map(e=>`<button class="eopt ${e===m.emoji?'sel':''}" style="background:var(--cream)">${e}</button>`).join("")}
      </div>
      <button class="btn-primary" onclick="saveMe()">저장하기</button>
    </div>
  </div>`;
  $("#modalRoot").querySelectorAll(".eopt").forEach(b=>b.onclick=()=>{
    $("#modalRoot").querySelectorAll(".eopt").forEach(x=>x.classList.toggle("sel",x===b));
  });
  setTimeout(()=>$("#meName").focus(),250);
}
function saveMe(){
  const m=member(meId); if(!m) return;
  const name=$("#meName").value.trim();
  if(!name){ $("#meName").style.borderColor="var(--danger)"; $("#meName").focus(); return; }
  const sel=document.querySelector("#modalRoot .eopt.sel");
  m.nickname=name; if(sel) m.emoji=sel.textContent;
  if(FB.on){ try{ roomRef().update({members:JSON.parse(JSON.stringify(S.trip.members))}).catch(fbErr); }catch(e){} }
  addFeed("이름을 바꿨어요 ✏️");
  save(); closeModal(); renderAll(); toast(`${m.emoji} ${name}님으로 바꿨어요!`);
}
function renderFamily(){
  const expOf = id => S.items.filter(i=>i.status==="완료"&&i.createdBy===id).reduce((a,i)=>a+itemKrw(i),0);
  const cmtOf = id => S.items.reduce((a,i)=>a+(i.comments||[]).filter(c=>c.by===id).length,0);
  $("#view-family").innerHTML = `
    <div class="card family-list">
      <div class="sec-title">👥 여행 멤버</div>
      ${S.trip.members.map(m=>`
        <div class="fm">
          <div class="avatar" style="background:${m.color}">${m.emoji}</div>
          <div><div class="nm">${esc(m.nickname)} ${m.id===meId?'<span style="font-size:.72rem;color:var(--coral-dark)">(나)</span>':""}</div>
          <div class="role">일정 ${S.items.filter(i=>i.createdBy===m.id).length} · 지출 ${(expOf(m.id)/10000).toFixed(0)}만원 · 댓글 ${cmtOf(m.id)}</div></div>
          ${m.id===meId?`<button class="swap" onclick="editMe()">✏️ 이름</button>`:`<button class="swap" onclick="pickMe('${m.id}')">전환</button>
          <button class="icon-btn" style="flex-shrink:0" onclick="askDelMember('${m.id}')">✕</button>`}
        </div>`).join("")}
      <div class="map-note" style="margin-top:8px">멤버는 각자 앱을 열고 이름을 입력하면 자동으로 추가돼요</div>
    </div>
    <div class="card">
      <div class="sec-title">🔔 새 소식 알림</div>
      ${notifCard()}
    </div>
    ${shareCard()}
    <div class="card">
      <div class="sec-title">🛠 앱 관리</div>
      <button class="btn-primary" style="margin-top:0;background:var(--teal);box-shadow:0 4px 14px rgba(23,162,162,.3)" onclick="openTripSettings()">✈️ 여행 이름·날짜 수정</button>
      <button class="btn-primary" style="margin-top:10px;background:#fff;color:var(--coral-dark);border:2px solid var(--coral);box-shadow:none" onclick="openHelp()">📖 사용법 보기</button>
    </div>
    ${FB.on?"":`<div class="card" style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button style="color:var(--ink-soft);font-size:.8rem;font-weight:700" onclick="startFresh()">🧹 새 여행 시작 (전체 비우기)</button>
      <button style="color:var(--ink-soft);font-size:.8rem;font-weight:700" onclick="resetDemo()">🔄 데모 데이터로 초기화</button>
    </div>`}`;
}
function notifCard(){
  if(!("Notification" in window))
    return `<div class="imp-hint" style="margin-top:0">이 브라우저는 알림을 지원하지 않아요. (아이폰 Safari는 지원이 제한적이에요 — 갤럭시·PC에서는 잘 작동해요!)</div>`;
  if(localStorage.getItem("pqgo_notif")==="on" && Notification.permission==="granted")
    return `<div class="imp-hint" style="margin-top:0">✅ 알림이 켜져 있어요 — 다른 멤버가 일정·지출·댓글을 올리면 알려드려요. (앱이 열려 있거나 백그라운드일 때)</div>
      <button class="btn-mini" style="width:100%;padding:11px 0;margin-top:8px" onclick="localStorage.removeItem('pqgo_notif');renderFamily();toast('알림을 껐어요')">🔕 알림 끄기</button>`;
  if(Notification.permission==="denied")
    return `<div class="imp-hint" style="margin-top:0">⚠️ 알림 권한이 거부돼 있어요. 브라우저 설정에서 이 사이트의 알림을 허용해주세요.</div>`;
  return `<div class="imp-hint" style="margin-top:0">다른 멤버가 일정·지출·댓글을 올리면 알려드려요. 버튼을 누르면 브라우저가 <b>알림 동의</b>를 물어봐요.</div>
    <button class="btn-primary" style="margin-top:10px" onclick="enableNotif()">🔔 알림 켜기</button>`;
}
async function enableNotif(){
  if(!("Notification" in window)) return;
  const p = await Notification.requestPermission();
  if(p==="granted"){ localStorage.setItem("pqgo_notif","on"); toast("알림이 켜졌어요 🔔"); }
  else toast("알림이 허용되지 않았어요");
  renderFamily();
}
function maybeNotify(fresh){
  if(localStorage.getItem("pqgo_notif")!=="on") return;
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  fresh.filter(f=>f.who!==meId).slice(0,3).forEach(f=>{
    const m=member(f.who)||{nickname:"멤버"};
    try{ new Notification((S.trip.title||"푸꾸옥 꼬우")+" 🥥", {body:`${m.nickname}님이 ${f.txt}`, tag:"pqgo"+f.ts}); }catch(e){}
  });
}
function shareCard(){
  if(FB.on){
    return `<div class="card" style="text-align:center">
      <div class="sec-title" style="justify-content:center">🟢 가족 실시간 공유 중</div>
      <div style="font-size:2rem;font-weight:900;letter-spacing:.28em;color:var(--coral-dark);margin:6px 0 2px">${FB.code}</div>
      <div style="font-size:.8rem;color:var(--ink-soft);margin-bottom:12px">이 코드를 가족에게 알려주세요 — 누가 고쳐도 모두의 화면에 바로 반영돼요</div>
      <button class="btn-primary" style="margin-top:0" onclick="copyCode()">📋 초대 메시지 복사</button>
      <button style="margin-top:12px;color:var(--ink-soft);font-size:.8rem;font-weight:700" onclick="leaveRoom()">📴 가족방 나가기 (혼자 모드)</button>
    </div>`;
  }
  if(FB.status==="connecting"){
    return `<div class="card" style="text-align:center"><div class="imp-msg"><span class="spin">🥥</span> 가족방에 연결하는 중…</div></div>`;
  }
  if(getFbConfig()){
    return `<div class="card">
      <div class="sec-title">✉️ 가족 실시간 공유</div>
      ${FB.err?`<div class="imp-msg">⚠️ ${esc(FB.err)}</div>`:""}
      <button class="btn-primary" style="margin-top:4px" onclick="createRoom()">🏠 새 여행방 만들기</button>
      <button class="btn-primary" style="margin-top:10px;background:var(--teal);box-shadow:0 4px 14px rgba(23,162,162,.3)" onclick="joinRoomModal()">🔑 초대 코드로 참여</button>
      <div style="text-align:center;margin-top:12px">
        <button style="color:var(--ink-soft);font-size:.78rem;font-weight:700" onclick="fbSetupModal()">⚙️ Firebase 설정 다시 하기</button>
      </div>
    </div>`;
  }
  return `<div class="card placeholder" style="padding:24px 16px">
    <span class="big" style="font-size:2.2rem">✉️</span>
    <h3 style="font-size:1rem">가족과 실시간으로 함께 쓰기</h3>
    <p>초대 코드로 가족을 부르면 일정 수정이<br>모두의 화면에 즉시 반영돼요 (무료)</p>
    <button class="stage-badge" style="border:none;cursor:pointer;font-size:.85rem" onclick="fbSetupModal()">⚙️ 5분 설정 시작하기</button>
    <p style="margin-top:10px;font-size:.74rem">설정 없이도 지금처럼 혼자 쓸 수 있어요.<br>가족에게 코드를 받았다면 설정 후 '코드로 참여'를 누르세요.</p>
  </div>`;
}
function askDelMember(id){
  const m=member(id); if(!m) return;
  $("#modalRoot").innerHTML=`
  <div class="modal-bg" style="align-items:center" onclick="if(event.target===this)closeModal()">
    <div class="confirm-box">
      <div class="big">${m.emoji}</div>
      <p>'${esc(m.nickname)}'님을<br>멤버에서 삭제할까요?<br><span style="font-size:.78rem;font-weight:600;color:var(--ink-soft)">그 멤버가 만든 일정·지출은 그대로 남아요</span></p>
      <div class="btns">
        <button class="b-gray" onclick="closeModal()">취소</button>
        <button class="b-red" onclick="delMember('${id}')">삭제</button>
      </div>
    </div>
  </div>`;
}
function delMember(id){
  const m=member(id); if(!m) return;
  S.trip.members=S.trip.members.filter(x=>x.id!==id);
  if(FB.on) roomRef().update({members:JSON.parse(JSON.stringify(S.trip.members))}).catch(fbErr);
  addFeed(`멤버 '${m.nickname}'을(를) 삭제했어요`);
  save(); closeModal(); renderAll(); toast(`${m.emoji} ${m.nickname}님을 삭제했어요`);
}
function startFresh(){
  $("#modalRoot").innerHTML=`
  <div class="modal-bg" style="align-items:center" onclick="if(event.target===this)closeModal()">
    <div class="confirm-box">
      <div class="big">🧹</div>
      <p>모든 일정·지출·준비물·멤버를 비우고<br>새 여행을 시작할까요?<br><span style="font-size:.78rem;font-weight:600;color:var(--ink-soft)">멤버는 나만 남고, 여행 이름·날짜는 유지돼요</span></p>

      </div>
    </div>
  </div>`;
}
function doStartFresh(){
  const me=member(meId)||{id:meId||("u"+Date.now()), nickname:"나", emoji:"🙋", color:DAY_COLORS[0]};
  S={trip:{title:S.trip.title, startDate:S.trip.startDate, endDate:S.trip.endDate, members:[me]},
     items:[], pack:[], expenses:[], diary:{}, feed:[]};

  save(); closeModal(); renderAll();

      <div class="big">🔄</div>
